// ── HELPERS ───────────────────────────────────────────────────────────────────
function fl(n){return new Intl.NumberFormat("ro-RO",{maximumFractionDigits:0}).format(Math.abs(n))+" lei";}
function fk(n){return n>=1000?Math.round(n/1000)+"k":String(Math.round(n));}
function ml(iso){if(!iso)return"";var p=iso.split("-");var nm=["Ian","Feb","Mar","Apr","Mai","Iun","Iul","Aug","Sep","Oct","Nov","Dec"];return nm[parseInt(p[1],10)-1]+" "+p[0];}

function timeline(){
  var em={};
  S.pay.forEach(function(p){var k=p.date.slice(0,7);em[k]=(em[k]||0)+Number(p.amount);});
  var lines=[],bal=S.bal,sc=S.sched;
  for(var i=0;i<sc.length;i++){
    bal=Math.max(0,bal-sc[i].principal);
    var k=sc[i].date.slice(0,7),sur=em[k]||MONTHLY_SURPLUS;
    bal=Math.max(0,bal-sur);
    lines.push({date:k,balance:Math.round(bal),hasExtra:sur>0});
    if(bal<=0)return lines;
  }
  if(!sc.length)return lines;
  var last=sc[sc.length-1],lastD=new Date(last.date);
  for(var m=1;m<=120;m++){
    var d=new Date(lastD);d.setMonth(d.getMonth()+m);
    var rate=d<new Date("2028-03-24")?0.0479/12:0.0768/12;
    var interest=bal*rate,principal=Math.min(last.total-interest,bal);
    bal=Math.max(0,bal-principal);
    var ymk=d.toISOString().slice(0,7),surp=em[ymk]||MONTHLY_SURPLUS;
    bal=Math.max(0,bal-surp);
    lines.push({date:ymk,balance:Math.round(bal),hasExtra:surp>0});
    if(bal<=0)return lines;
  }
  return lines;
}

function calcSavings(){
  var totalA=0,totalMC=0;
  S.pay.forEach(function(p){totalA+=Number(p.amount);totalMC+=(p.monthsCut||0);});
  var tl=timeline();
  var pe=tl.length?tl[tl.length-1].date:ORIG_END;
  var savedP=S.pay;S.pay=[];
  var tl2=timeline();
  var ne=tl2.length?tl2[tl2.length-1].date:ORIG_END;
  S.pay=savedP;
  var wp=pe.split("-").map(Number),wop=ne.split("-").map(Number);
  var ms=Math.max(0,(wop[0]-wp[0])*12+(wop[1]-wp[1]));
  var ai=0;
  if(S.sched.length){var ti=S.sched.reduce(function(s,r){return s+r.interest;},0);ai=ti/S.sched.length;}
  else ai=S.bal*0.0479/12;
  return{totalA:Math.round(totalA),totalMC:totalMC,ms:ms,is:Math.round(ms*ai),ys:(ms/12).toFixed(1),pe:pe,ne:ne};
}

function calcMsum(n){
  var sc=S.sched;if(sc.length<2)return 0;
  var sum=0;for(var i=1;i<=n&&i<sc.length;i++)sum+=sc[i].principal;
  return Math.round(sum*100)/100;
}

// Savings auto-calc from transactions
function calcSavingsFromTxn(){
  var into=0,outof=0;
  S.txn.forEach(function(t){
    if(!t.credit&&t.cat==="economii") outof+=t.amt; // money moved TO savings
    // money FROM savings are tagged "alte_intrari" with desc containing "Economii"
    if(t.credit&&(t.desc||"").toLowerCase().indexOf("economii")!==-1) into-=t.amt; // reduces savings
  });
  // net movement: positive = added to savings, negative = took from savings
  return {into:outof, outof:outof===0?0:0, net:outof}; // simplified: track separately
}

function savingsDelta(){
  var added=0,removed=0;
  S.txn.forEach(function(t){
    if(!t.credit&&t.cat==="economii") added+=t.amt;
    if(t.credit&&(t.desc||"").toLowerCase().indexOf("economii")!==-1) removed+=t.amt;
  });
  return{added:added,removed:removed,net:added-removed};
}

// SVG credit chart
function creditSVG(tl){
  var W=500,H=155,PL=38,maxB=S.bal;
  if(!tl.length||maxB<=0)return"<p style='color:#374151;text-align:center;padding:20px'>Nu există date</p>";
  var pts=tl.map(function(p,i){return{x:PL+(i/Math.max(tl.length-1,1))*(W-PL),y:H-(Math.max(0,p.balance)/maxB)*H,date:p.date,balance:p.balance,hasExtra:p.hasExtra};});
  var poly=pts.map(function(p){return p.x+","+p.y;}).join(" ");
  var area=pts.length>1?pts[0].x+","+H+" "+poly+" "+pts[pts.length-1].x+","+H:"";
  var s='<svg viewBox="0 0 '+W+' '+(H+28)+'" style="width:100%;min-width:260px">';
  s+='<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f5c842" stop-opacity="0.2"/><stop offset="100%" stop-color="#f5c842" stop-opacity="0"/></linearGradient></defs>';
  for(var fi=0;fi<=4;fi++){var f=fi*0.25,gy=H-f*H,gv=Math.round(f*maxB/1000);s+='<line x1="'+PL+'" y1="'+gy+'" x2="'+W+'" y2="'+gy+'" stroke="#1a1f2e" stroke-width="1"/><text x="'+(PL-3)+'" y="'+(gy+4)+'" text-anchor="end" fill="#2d3748" font-size="9">'+gv+'k</text>';}
  MILESTONES.forEach(function(m){if(m<=0||m>=maxB)return;var my=H-(m/maxB)*H;s+='<line x1="'+PL+'" y1="'+my+'" x2="'+W+'" y2="'+my+'" stroke="#f5c842" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/><text x="'+(W-2)+'" y="'+(my-2)+'" text-anchor="end" fill="#f5c842" font-size="8" opacity="0.4">'+fk(m)+'</text>';});
  if(area)s+='<polygon points="'+area+'" fill="url(#ag)"/>';
  if(pts.length>1)s+='<polyline points="'+poly+'" fill="none" stroke="#f5c842" stroke-width="2"/>';
  pts.forEach(function(p){if(p.hasExtra)s+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#6ee7b7" opacity="0.9"/>';});
  pts.forEach(function(p,i){if(i%6===0)s+='<text x="'+p.x+'" y="'+(H+16)+'" text-anchor="middle" fill="#2d3748" font-size="8">'+p.date+'</text>';});
  s+='</svg>';return s;
}

function setSav(delta){
  var v=parseFloat(document.getElementById("savAmt").value);
  if(isNaN(v))return;
  var sd=savingsDelta();
  if(delta&&S.savBal!==null){S.savBal+=v;}
  else{S.savBal=v-sd.added+sd.removed;}
  svs();renderExtras();
}

}

function chCat(i,v){
  S.txn[i].cat=v;
  // if categorized as datorie_in, update debtor balance
  if(v==="datorie_in"&&S.debtors.length>0){
    // find debtor and subtract
    var t=S.txn[i];
    // ask user or auto-apply to first debtor
    S.debtors[0].currentAmount=Math.max(0,S.debtors[0].currentAmount-t.amt);
    svd();
    renderDatorii();
  }
  svt();renderTxn();renderExtras();
}

function payDeb(di){
  var inp=document.getElementById("deb"+di+"amt");
  var v=parseFloat(inp.value);
  if(isNaN(v)||v<=0)return;
  S.debtors[di].currentAmount=Math.max(0,S.debtors[di].currentAmount-v);
  svd();inp.value="";renderDatorii();
}
function removeDeb(di){if(confirm("Ștergi această persoană?"))S.debtors.splice(di,1);svd();renderDatorii();}
function addDeb(){
  var name=document.getElementById("debName").value.trim();
  var amt=parseFloat(document.getElementById("debAmt").value);
  var note=document.getElementById("debNote").value.trim();
  if(!name||isNaN(amt)||amt<=0)return;
  S.debtors.push({id:Date.now(),name:name,startAmount:amt,currentAmount:amt,note:note});

}

async function uploadCreditPDF(file){
  if(!file||file.type!=="application/pdf"){S.upMsg="❌ PDF invalid";renderSettings();return;}
  S.uploading=true;S.upMsg="";renderSettings();
  try{
    var b64=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result.split(",")[1]);};r.onerror=rej;r.readAsDataURL(file);});
    var resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}},{type:"text",text:"Grafic rambursare credit BCR. Returneaza DOAR JSON valid fara markdown:\n{\"currentBalance\":float,\"scheduleDate\":\"string\",\"rows\":[{\"nr\":int,\"date\":\"YYYY-MM-DD\",\"principal\":float,\"interest\":float,\"insurance\":float,\"total\":float,\"balance\":float}]}"}]},{role:"assistant",content:[{type:"text",text:"{"}]}]})});
    var data=await resp.json();
    var raw="{"+data.content.map(function(c){return c.text||"";}).join("").trim().replace(/^```[a-z]*\n?/i,"").replace(/```$/,"").trim();

    var parsed=JSON.parse(raw);
    if(!parsed.rows||!parsed.rows.length)throw new Error("Nu am gasit randuri.");
    S.sched=parsed.rows;S.bal=parsed.currentBalance;S.sdate=parsed.scheduleDate||S.sdate;
    svc();S.upMsg="✅ Grafic actualizat cu "+parsed.rows.length+" rate!";
  }catch(e){
    // retry without prefill
    try{
      var b64b=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result.split(",")[1]);};r.onerror=rej;r.readAsDataURL(file);});
      var resp2=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:[{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64b}},{type:"text",text:"Grafic rambursare credit BCR. Returneaza DOAR JSON valid fara markdown fara backtick-uri:\n{\"currentBalance\":float,\"scheduleDate\":\"string\",\"rows\":[{\"nr\":int,\"date\":\"YYYY-MM-DD\",\"principal\":float,\"interest\":float,\"insurance\":float,\"total\":float,\"balance\":float}]}"}]}]})});
      var data2=await resp2.json();
      var raw2=data2.content.map(function(c){return c.text||"";}).join("").trim().replace(/^```[a-z]*\n?/i,"").replace(/```$/,"").trim();
      var parsed2=JSON.parse(raw2);
      if(!parsed2.rows||!parsed2.rows.length)throw new Error("Nu am gasit randuri.");
      S.sched=parsed2.rows;S.bal=parsed2.currentBalance;S.sdate=parsed2.scheduleDate||S.sdate;
      svc();S.upMsg="✅ Grafic actualizat!";
    }catch(e2){S.upMsg="❌ Eroare: "+e2.message;}
  }
  S.uploading=false;renderSettings();
}

async function handlePDF(e){
  var file=e.target.files[0];if(!file)return;
  document.getElementById("overlay").classList.add("show");
  try{
    var buf=await file.arrayBuffer();
    var pdf=await pdfjsLib.getDocument({data:buf}).promise;
    var fullText="";
    for(var i=1;i<=pdf.numPages;i++){
      var page=await pdf.getPage(i);
      var content=await page.getTextContent();
      var byY={};
      content.items.forEach(function(item){var y=Math.round(item.transform[5]);if(!byY[y])byY[y]=[];byY[y].push({x:item.transform[4],str:item.str});});
      Object.keys(byY).sort(function(a,b){return b-a;}).forEach(function(y){fullText+=byY[y].sort(function(a,b){return a.x-b.x;}).map(function(i){return i.str;}).join(" ")+"\n";});
    }
    var result=parseBCR(fullText);
    document.getElementById("overlay").classList.remove("show");
    if(result.length>0){S.txn=result;svt();renderExtras();renderTxn();}
  }catch(err){document.getElementById("overlay").classList.remove("show");console.error(err);}
  e.target.value="";
}

function parseBCR(text){
  var result=[];var blob=text.replace(/\n/g," ");
  var dateRe=/(\d{2}-\d{2}-\d{4})\s+\d{2}:\d{2}/g;
  var matches=Array.from(blob.matchAll(dateRe));
  var idc=Date.now();
  for(var i=0;i<matches.length;i++){
    var start=matches[i].index;
    var end=i+1<matches.length?matches[i+1].index:blob.length;
    var blk=blob.substring(start,end);
    var dateStr=matches[i][1];
    if(blk.indexOf("Sold contabil")!==-1||blk.indexOf("Data operatiunii")!==-1)continue;
    var amt=null,isC=false;
    var crm=blk.match(/Tranz creditare[^,]*Suma\s+([\d\s]+[.,]\d{2})\s*RON/);
    var spm=blk.match(/Suma platita\s+([\d\s]+[.,]\d{2})\s*RON/);
    var svm=blk.match(/Suma in valuta contului\s+([\d\s]+[.,]\d{2})\s*RON/);
    // also match credit transfers
    var crAmt=blk.match(/0[,]00\s+(\d{1,3}(?:[.]\d{3})*[,]\d{2})\b/);
    var dbAmt=blk.match(/\b(\d{1,3}(?:[.]\d{3})*[,]\d{2})\s+0[,]00\b/);
    if(crm){amt=parseFloat(crm[1].replace(/\s/g,"").replace(",","."));isC=true;}
    else if(spm){amt=parseFloat(spm[1].replace(/\s/g,"").replace(",","."));}
    else if(svm){amt=parseFloat(svm[1].replace(/\s/g,"").replace(",","."));}
    else if(crAmt){amt=parseFloat(crAmt[1].replace(".","").replace(",","."));isC=true;}
    else if(dbAmt){amt=parseFloat(dbAmt[1].replace(".","").replace(",","."));}
    if(!amt||isNaN(amt)||amt<0.5)continue;
    var desc="Tranzacție",cat="altele";
    if(blk.indexOf("Google Pay")!==-1)desc="Google Pay";
    if(blk.indexOf("M4M")!==-1)desc="M4M";
    if(blk.indexOf("Incasare rata credit")!==-1){desc="Rata credit";cat="credit";}
    else if(blk.indexOf("Incasare rata dobanda")!==-1){desc="Dobândă credit";cat="credit";}
    else if(blk.indexOf("Incasare Cost Asigurare")!==-1){desc="Asigurare credit";cat="credit";}
    else if(blk.indexOf("Rambursare Credit curent")!==-1){desc="Rambursare anticipată";cat="rambursare";}
    else if(blk.indexOf("Rambursare Dobanda")!==-1){desc="Rambursare dobândă";cat="credit";}
    else if(blk.indexOf("SALARIU")!==-1||blk.indexOf("DB GLOBAL TECHNOLOGY")!==-1){desc="Salariu";isC=true;cat="salariu";}
    else if(blk.indexOf("Money reserve")!==-1){desc="Transfer Economii";cat=isC?"alte_intrari":"economii";}
    else if(blk.indexOf("Scarlat Milica")!==-1||blk.indexOf("SCARLAT MILICA")!==-1){desc="Cadou - Scarlat Milica";isC=true;cat="alte_intrari";}
    else if(blk.indexOf("Scarlat Adrian")!==-1||blk.indexOf("SCARLAT ANAMARIA")!==-1&&isC){desc="Intrare - Scarlat Adrian-Daniel";isC=true;cat="alte_intrari";}
    else if(blk.indexOf("Comision conversie")!==-1){desc="Comision conversie";cat="altele";}
    // get merchant
    var lm=blk.match(/Locatie:[\s\S]*?RO\s+([A-Z0-9][^\n\.\,]{2,40}?)(?:\s+(?:Bucuresti|BUCURESTI|Cluj|Iasi|Dublin|Amsterdam|Cork|London|Voluntari|Tulcea|Cepari|Napoca))/);
    if(lm&&desc==="Google Pay")desc="Google Pay - "+lm[1].trim();
    else if(lm&&desc==="M4M")desc="M4M - "+lm[1].trim();
    else if(lm&&desc==="Tranzacție")desc=lm[1].trim();
    if(cat==="altele")cat=autocat(desc+" "+blk.toLowerCase());
    if(isC&&cat==="altele")cat="alte_intrari";
    result.push({id:idc++,date:dateStr,desc:desc,amt:amt,credit:isC,cat:cat});
  }
  return result;
}
